<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>訪問管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
  :root{--bg:#0f0f12;--surface:#1a1a20;--surface2:#23232c;--border:#2e2e3a;--accent:#c8a96e;--accent2:#7eb8a4;--text:#e8e8ec;--text2:#9090a0;--danger:#e07070;--radius:10px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  header h1{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--accent);letter-spacing:.05em}
  header span{font-size:12px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
  .tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .view{display:none;padding:16px}.view.active{display:block}

  /* FORM */
  .form-group{margin-bottom:14px}
  label{display:block;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
  input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;padding:10px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none;box-sizing:border-box}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  .product-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .product-name{flex:2;min-width:0}
  .product-qty{flex:1;min-width:0}
  .del-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--danger);font-size:16px;width:36px;height:40px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
  .add-btn{background:none;border:1px dashed var(--border);border-radius:var(--radius);color:var(--text2);font-size:13px;padding:8px;width:100%;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
  .submit-btn{background:var(--accent);color:#0f0f12;border:none;border-radius:var(--radius);font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;padding:14px;width:100%;cursor:pointer;margin-top:8px}
  .submit-btn:active{opacity:.8}

  /* QUICK MEMO */
  .quick-memo-box{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:16px}
  .box-label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace;margin-bottom:8px}
  .quick-actions{display:flex;gap:8px;margin-top:8px}
  .quick-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:'Noto Sans JP',sans-serif;font-size:13px;padding:9px;cursor:pointer;text-align:center}
  .quick-btn.primary{background:var(--accent);color:#0f0f12;font-weight:700;border-color:var(--accent)}
  .quick-btn:active{opacity:.75}
  .cowork-output{display:none;background:var(--surface2);border:1px solid var(--accent2);border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text)}
  .cowork-output.visible{display:block}
  .copy-cowork-btn{width:100%;margin-top:8px;background:var(--accent2);color:#0f0f12;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;padding:11px;cursor:pointer}
  .section-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .phrase-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .phrase-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:6px 10px;cursor:pointer}
  .phrase-btn:active{border-color:var(--accent);color:var(--accent)}

  /* LIST */
  .list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .count-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
  .filter-bar{display:flex;gap:8px;margin-bottom:8px}
  .filter-bar input{flex:1}
  .search-hint{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.6}
  .search-hint .hit-count{color:var(--accent);font-family:'IBM Plex Mono',monospace}
  .history-summary{background:var(--surface);border:1px solid var(--accent2);border-radius:var(--radius);padding:12px;margin-bottom:14px;display:none}
  .history-summary.visible{display:block}
  .history-summary .hs-title{font-size:12px;color:var(--accent2);font-family:'IBM Plex Mono',monospace;margin-bottom:8px}
  .history-summary ul{list-style:none;padding:0}
  .history-summary ul li{font-size:12px;color:var(--text);line-height:1.9;padding-left:1em;text-indent:-1em}
  .history-summary ul li::before{content:"・"}
  .visit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .visit-card.search-match{border-color:var(--accent2)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .card-name{font-size:15px;font-weight:700}.card-date{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;flex-shrink:0;margin-left:8px}
  .card-person{font-size:12px;color:var(--accent2);margin-bottom:6px}
  .product-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .product-tag{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:11px;color:var(--text2)}
  .product-tag.hit{border-color:var(--accent);color:var(--accent)}
  .card-action{font-size:12px;color:var(--accent);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .card-memo{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
  .highlight{background:rgba(200,169,110,.25);color:var(--accent);border-radius:2px;padding:0 2px}
  .card-btns{display:flex;gap:6px;margin-top:10px}
  .card-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;padding:7px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-align:center}
  .card-btn.copy{color:var(--accent2)}.card-btn.del{color:var(--danger)}
  .empty{text-align:center;color:var(--text2);padding:60px 0;font-size:13px;line-height:2}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent2);color:#0f0f12;font-weight:700;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>VISIT MGR</h1>
  <span id="today-label"></span>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('form')">＋ 詳細入力</div>
  <div class="tab" onclick="switchTab('memo')">📝 メモ入力</div>
  <div class="tab" onclick="switchTab('list')">一覧</div>
</div>

<!-- 詳細入力 -->
<div class="view active" id="view-form">
  <div class="form-group"><label>得意先名 *</label><input type="text" id="f-name" placeholder="例：ヴィンヤード春日井燃料" autocomplete="off"></div>
  <div class="form-group"><label>担当者名</label><input type="text" id="f-person" placeholder="例：上久保"></div>
  <div class="form-group"><label>訪問日時</label><input type="datetime-local" id="f-datetime"></div>
  <div class="form-group">
    <label>商品・数量</label>
    <div id="products-container"></div>
    <button class="add-btn" onclick="addProduct()">＋ 商品を追加</button>
  </div>
  <div class="form-group"><label>メモ</label><textarea id="f-memo" placeholder="反応・特記事項など" oninput="syncMemo('form')"></textarea></div>
  <div class="form-group"><label>次回アクション</label><input type="text" id="f-action" placeholder="例：来週火曜にフォロー"></div>
  <button class="submit-btn" onclick="saveRecord()">記録を保存</button>
</div>

<!-- メモ入力 -->
<div class="view" id="view-memo">
  <div class="quick-memo-box">
    <div class="box-label">⚡ クイックメモ → コワーク整形</div>
    <textarea id="quick-text" placeholder="例：ヴィンヤード春日井燃料 上久保 CSリースリング6本納品 来週火曜フォロー&#10;例：ケスイート 不在 水木定休&#10;例：炭火バルVIVAN テイスティング リースリング好評" oninput="syncMemo('memo')"></textarea>
    <div class="quick-actions">
      <button class="quick-btn" onclick="clearQuick()">クリア</button>
      <button class="quick-btn primary" onclick="formatQuick()">コワーク用に整形</button>
    </div>
    <div class="cowork-output" id="cowork-output"></div>
    <button class="copy-cowork-btn" id="copy-cowork-btn" style="display:none" onclick="copyCowork()">📋 コワークにコピー</button>
  </div>
  <div class="section-label">よく使うフレーズ TOP10</div>
  <div class="phrase-grid">
    <button class="phrase-btn" onclick="ins('納品')">納品</button>
    <button class="phrase-btn" onclick="ins('テイスティング実施')">試飲</button>
    <button class="phrase-btn" onclick="ins('不在')">不在</button>
    <button class="phrase-btn" onclick="ins('Cave Spring Riesling')">CS Riesling</button>
    <button class="phrase-btn" onclick="ins('Cave Spring Cabernet Franc')">CS Cab Franc</button>
    <button class="phrase-btn" onclick="ins(&quot;Quails' Gate Chardonnay&quot;)">QG Chardonnay</button>
    <button class="phrase-btn" onclick="ins('集金')">集金</button>
    <button class="phrase-btn" onclick="ins('受注')">受注</button>
    <button class="phrase-btn" onclick="ins('資料投函')">資料投函</button>
    <button class="phrase-btn" onclick="ins('Marine Divintners Shiraz')">Marine Shiraz</button>
  </div>
</div>

<!-- 一覧 -->
<div class="view" id="view-list">
  <div class="list-header">
    <span style="font-size:13px;color:var(--text2)">訪問履歴</span>
    <span class="count-badge" id="count-badge">0件</span>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="card-btn copy" style="flex:1;padding:9px;font-size:12px" onclick="exportData()">📤 エクスポート</button>
    <label class="card-btn" style="flex:1;padding:9px;font-size:12px;text-align:center;cursor:pointer;color:var(--accent2)">📥 インポート<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
  <div class="filter-bar"><input type="text" id="search-input" placeholder="🔍 キーワード検索（店名・担当者・メモ・商品）" oninput="renderList()" autocomplete="off"></div>
  <div id="search-hint" class="search-hint" style="display:none"></div>
  <div class="history-summary" id="history-summary">
    <div class="hs-title" id="hs-title"></div>
    <ul id="hs-list"></ul>
  </div>
  <div id="list-container"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SK='visit_records_v3';
let records=[];
function load(){try{const d=localStorage.getItem(SK);records=d?JSON.parse(d):[]}catch(e){records=[]}}
function save(){localStorage.setItem(SK,JSON.stringify(records))}

function init(){
  load();
  const now=new Date();
  document.getElementById('today-label').textContent=now.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('f-datetime').value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  addProduct();renderList();
}

function switchTab(tab){
  ['form','memo','list'].forEach((t,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===tab);
    document.getElementById('view-'+t).classList.toggle('active',t===tab);
  });
  if(tab==='list')renderList();
}

function syncMemo(from){
  if(from==='form'){
    document.getElementById('quick-text').value=document.getElementById('f-memo').value;
  } else {
    document.getElementById('f-memo').value=document.getElementById('quick-text').value;
  }
}

function ins(p){
  const ta=document.getElementById('quick-text');
  const pos=ta.selectionStart,val=ta.value;
  ta.value=val.slice(0,pos)+p+val.slice(pos);
  ta.focus();ta.selectionStart=ta.selectionEnd=pos+p.length;
  syncMemo('memo');
}

function clearQuick(){
  document.getElementById('quick-text').value='';
  document.getElementById('f-memo').value='';
  document.getElementById('cowork-output').classList.remove('visible');
  document.getElementById('cowork-output').textContent='';
  document.getElementById('copy-cowork-btn').style.display='none';
}

function expand(line){
  return line
    .replace(/CSリースリング|CSリスリング/gi,'Cave Spring Riesling')
    .replace(/CSカベルネ|CSカブフラン|CSカベフラン/gi,'Cave Spring Cabernet Franc')
    .replace(/CSシャルドネ/gi,'Cave Spring Chardonnay')
    .replace(/QGシャルドネ/gi,"Quails' Gate Chardonnay")
    .replace(/QGピノ/gi,"Quails' Gate Pinot Noir")
    .replace(/クラウデタワー|クラウディタワー|クラウディットアワー/gi,'Cloudy Tower')
    .replace(/エルズゲート|クエイルズゲート/gi,"Quails' Gate")
    .replace(/マリンシラズ|マリンシラーズ/gi,'Marine Divintners Shiraz');
}

function formatQuick(){
  const raw=document.getElementById('quick-text').value.trim();
  if(!raw){showToast('メモを入力してください');return;}
  const now=new Date();
  const dateStr=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const lines=raw.split(/[\n。]/).map(l=>l.trim()).filter(Boolean);
  let out=`【訪問記録】${dateStr}\n\n`;
  lines.forEach(l=>{out+=`■ ${expand(l)}\n`;});
  out=out.trimEnd();
  const el=document.getElementById('cowork-output');
  el.textContent=out;el.classList.add('visible');
  document.getElementById('copy-cowork-btn').style.display='block';
}

function copyCowork(){
  const text=document.getElementById('cowork-output').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('📋 コピーしました')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('📋 コピーしました');
  });
}

function addProduct(){
  const c=document.getElementById('products-container');
  const row=document.createElement('div');
  row.className='product-row';
  const nameInput=document.createElement('input');
  nameInput.type='text';nameInput.className='product-name';nameInput.placeholder='商品名';
  const qtyInput=document.createElement('input');
  qtyInput.type='text';qtyInput.className='product-qty';qtyInput.placeholder='数量';
  const delBtn=document.createElement('button');
  delBtn.className='del-btn';delBtn.textContent='×';delBtn.onclick=function(){row.remove();};
  row.appendChild(nameInput);row.appendChild(qtyInput);row.appendChild(delBtn);
  c.appendChild(row);
}

function getProducts(){
  const out=[];
  document.querySelectorAll('#products-container .product-row').forEach(r=>{
    const name=r.querySelector('.product-name').value.trim();
    const qty=r.querySelector('.product-qty').value.trim();
    if(name)out.push({name,qty});
  });
  return out;
}

function saveRecord(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){showToast('得意先名を入力してください');return;}
  const rec={id:Date.now(),name,person:document.getElementById('f-person').value.trim(),datetime:document.getElementById('f-datetime').value,products:getProducts(),memo:document.getElementById('f-memo').value.trim(),action:document.getElementById('f-action').value.trim()};
  records.unshift(rec);save();showToast('✓ 保存しました');resetForm();switchTab('list');
}

function resetForm(){
  ['f-name','f-person','f-action','f-memo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('quick-text').value='';
  document.getElementById('products-container').innerHTML='';addProduct();
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  document.getElementById('f-datetime').value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

// キーワードをハイライト付きHTMLに変換
function highlight(text, q){
  if(!q||!text)return esc(text||'');
  const escaped=esc(text);
  const escapedQ=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return escaped.replace(new RegExp(escapedQ,'gi'),m=>`<span class="highlight">${m}</span>`);
}

// レコードがクエリにヒットするか、ヒット箇所も返す
function matchRecord(r, q){
  if(!q)return{hit:true,fields:[]};
  const lower=q.toLowerCase();
  const fields=[];
  if(r.name&&r.name.toLowerCase().includes(lower))fields.push('name');
  if(r.person&&r.person.toLowerCase().includes(lower))fields.push('person');
  if(r.memo&&r.memo.toLowerCase().includes(lower))fields.push('memo');
  if(r.action&&r.action.toLowerCase().includes(lower))fields.push('action');
  if((r.products||[]).some(p=>p.name&&p.name.toLowerCase().includes(lower)))fields.push('products');
  return{hit:fields.length>0,fields};
}

function renderList(){
  const q=(document.getElementById('search-input').value||'').trim();
  const qLow=q.toLowerCase();

  let filtered;
  let matchMap={};
  if(q){
    filtered=records.filter(r=>{
      const m=matchRecord(r,qLow);
      if(m.hit){matchMap[r.id]=m.fields;return true;}
      return false;
    });
  } else {
    filtered=records;
  }

  document.getElementById('count-badge').textContent=`${filtered.length}件`;

  // 検索ヒント表示
  const hintEl=document.getElementById('search-hint');
  if(q&&filtered.length>0){
    hintEl.style.display='block';
    hintEl.innerHTML=`<span class="hit-count">${filtered.length}件</span> ヒット`;
  } else if(q&&filtered.length===0){
    hintEl.style.display='block';
    hintEl.innerHTML=`「${esc(q)}」に一致する記録はありません`;
  } else {
    hintEl.style.display='none';
  }

  // history summary（店名で1件以上ヒット時）
  const summaryBox=document.getElementById('history-summary');
  const hsList=document.getElementById('hs-list');
  const hsTitle=document.getElementById('hs-title');
  if(q&&filtered.length>0){
    hsTitle.textContent=`「${q}」の訪問履歴 ${filtered.length}件`;
    hsList.innerHTML=filtered.map(r=>{
      const dt=r.datetime?new Date(r.datetime).toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'}):'日付不明';
      const parts=[];
      if(r.products&&r.products.length)parts.push(r.products.map(p=>p.name+(p.qty?' '+p.qty:'')).join('、'));
      if(r.memo)parts.push(r.memo.slice(0,30)+(r.memo.length>30?'…':''));
      if(r.action)parts.push('→'+r.action);
      return `<li>${dt}　${esc(r.name)}　${parts.length?parts.join(' / '):'訪問'}</li>`;
    }).join('');
    summaryBox.classList.add('visible');
  } else {
    summaryBox.classList.remove('visible');
  }

  const c=document.getElementById('list-container');
  if(!filtered.length){
    c.innerHTML=q?'':`<div class="empty">記録がありません<br>詳細入力から追加してください</div>`;
    return;
  }

  c.innerHTML=filtered.map(r=>{
    const fields=matchMap[r.id]||[];
    const isMatch=q&&fields.length>0;
    const dt=r.datetime?new Date(r.datetime).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';

    // 商品タグ（ヒット商品はハイライト）
    const tags=(r.products||[]).map(p=>{
      const isHitProduct=q&&p.name&&p.name.toLowerCase().includes(qLow);
      return `<span class="product-tag${isHitProduct?' hit':''}">${highlight(p.name,isHitProduct?q:'')}${p.qty?' × '+esc(p.qty):''}</span>`;
    }).join('');

    // 名前・メモ・アクションのハイライト
    const nameHtml=fields.includes('name')?highlight(r.name,q):esc(r.name);
    const personHtml=r.person?(fields.includes('person')?highlight(r.person,q):esc(r.person)):'';
    const memoHtml=r.memo?(fields.includes('memo')?highlight(r.memo,q):esc(r.memo)):'';
    const actionHtml=r.action?(fields.includes('action')?highlight(r.action,q):esc(r.action)):'';

    return `<div class="visit-card${isMatch?' search-match':''}">
      <div class="card-top"><div class="card-name">${nameHtml}</div><div class="card-date">${dt}</div></div>
      ${personHtml?`<div class="card-person">👤 ${personHtml}</div>`:''}
      ${tags?`<div class="product-tags">${tags}</div>`:''}
      ${memoHtml?`<div class="card-memo">${memoHtml}</div>`:''}
      ${actionHtml?`<div class="card-action">→ ${actionHtml}</div>`:''}
      <div class="card-btns">
        <button class="card-btn copy" onclick="copyRecord(${r.id})">コワーク用コピー</button>
        <button class="card-btn del" onclick="deleteRecord(${r.id})">削除</button>
      </div></div>`;
  }).join('');
}

function copyRecord(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  const dt=r.datetime?new Date(r.datetime).toLocaleString('ja-JP'):'';
  let lines=[`【訪問記録】${dt}`,'',`得意先：${r.name}`];
  if(r.person)lines.push(`担当者：${r.person}`);
  if(r.products&&r.products.length){lines.push('商品：');r.products.forEach(p=>lines.push(`　・${p.name}${p.qty?' × '+p.qty:''}`));}
  if(r.memo)lines.push(`メモ：${r.memo}`);
  if(r.action)lines.push(`次回アクション：${r.action}`);
  const text=lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>showToast('📋 コピーしました')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('📋 コピーしました');
  });
}

function exportData(){
  if(!records.length){showToast('データがありません');return;}
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fname=`visit_mgr_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.json`;
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=fname;a.click();
  showToast(`📤 ${fname} を保存`);
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data))throw new Error();
      if(!confirm(`${data.length}件のデータをインポートします。現在のデータと統合します。よろしいですか？`))return;
      const existingIds=new Set(records.map(r=>r.id));
      const newRecs=data.filter(r=>!existingIds.has(r.id));
      records=[...records,...newRecs].sort((a,b)=>b.id-a.id);
      save();renderList();showToast(`✓ ${newRecs.length}件インポート`);
    }catch(err){showToast('ファイルが正しくありません');}
  };
  reader.readAsText(file);e.target.value='';
}

function deleteRecord(id){
  if(!confirm('削除しますか？'))return;
  records=records.filter(r=>r.id!==id);save();renderList();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

init();
</script>
</body>
